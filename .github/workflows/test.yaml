name: Test

env:
  # Must match the base pinned in the Dockerfile.
  CODING_RUNTIME_VERSION: v0.1.0

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  image-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: opencode-adapter:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The suite lives in coding-runtime and is fetched at the pinned tag — the
      # whole test/ directory rather than just the script, because the terminal
      # round-trip check bind-mounts a probe out of test/fixture-adapter/.
      - name: Fetch the conformance suite
        run: |
          curl -fsSL "https://github.com/language-operator/coding-runtime/archive/refs/tags/${CODING_RUNTIME_VERSION}.tar.gz" \
            | tar -xz --wildcards --strip-components=1 '*/test'
          chmod +x test/conformance.sh

      # Runs the image under the posture the operator imposes and an adapter
      # cannot override: read-only root, uid 1000, all capabilities dropped,
      # tmpfs /tmp. Checks doctor, that seeding is idempotent and writes nothing
      # outside /tmp and /workspace, the probe endpoints, manifest redaction, the
      # cross-origin WebSocket guard, and a keystroke round-tripping through tmux.
      - name: Run conformance suite
        run: ./test/conformance.sh opencode-adapter:test adapter

  chart-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v5
        with:
          version: 'latest'

      - name: Lint chart
        run: helm lint chart

      - name: Template chart
        run: helm template opencode chart
